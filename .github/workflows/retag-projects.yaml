name: Retag Projects

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run — show changes without applying them"
        type: boolean
        default: true

concurrency:
  group: retag-projects
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Retag all projects
        env:
          INPUT_URL: ${{ vars.DEPENDENCY_TRACK_HOSTNAME }}
          INPUT_API_KEY: ${{ secrets.DEPENDENCY_TRACK_APIKEY }}
          INPUT_DRY_RUN: ${{ inputs.dry-run || 'true' }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          PYTHONPATH=src python3 src/main.py retag-projects $DRY_RUN_FLAG
