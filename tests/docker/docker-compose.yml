name: Dependency-Track

services:
  apiserver:
    image: dependencytrack/apiserver:4.14.2
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
    environment:
      DT_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/dtrack"
      DT_DATASOURCE_USERNAME: "dtrack"
      DT_DATASOURCE_PASSWORD: "dtrack"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/version >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    ports:
    - "127.0.0.1:8081:8080"
    volumes:
    - "apiserver-data:/data"
    restart: unless-stopped

  frontend:
    image: dependencytrack/frontend:4.14.2
    environment:
      API_BASE_URL: "http://localhost:8081"
    ports:
    - "127.0.0.1:8082:8080"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "dtrack"
      POSTGRES_USER: "dtrack"
      POSTGRES_PASSWORD: "dtrack"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
    - "postgres-data:/var/lib/postgresql"

volumes:
  apiserver-data: {}
  postgres-data: {}